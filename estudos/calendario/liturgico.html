<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Calendário Litúrgico Católico — Roda do Ano da Graça com tempos litúrgicos e semanas interativas" />
  <title>Calendário Litúrgico Católico</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="calendario.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════
       HEADER
       ═══════════════════════════════════════════════ -->
  <header class="site-header">
    <p class="header-subtitle">Sancta Mater Ecclesia</p>
    <h1 class="header-title">Calendário Litúrgico</h1>
    <p class="header-tagline"><em>Annus Gratiæ</em> — O Ano da Graça</p>
  </header>

  <!-- ═══════════════════════════════════════════════
       MAIN
       ═══════════════════════════════════════════════ -->
  <main class="main-container">

    <!-- ─── WHEEL SECTION ─── -->
    <section class="wheel-section" aria-label="Roda do Calendário Litúrgico">

      <div class="wheel-wrapper">
        <svg
          id="liturgical-wheel"
          viewBox="0 0 1000 1000"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="Roda do Calendário Litúrgico com tempos e semanas clicáveis"
        >
          <!-- ─── DEFINITIONS ─── -->
          <defs>
            <!-- Gradiente dourado para o centro -->
            <radialGradient id="gold-grad" cx="35%" cy="30%" r="75%">
              <stop offset="0%"   stop-color="#e8c66b" />
              <stop offset="45%"  stop-color="#c49628" />
              <stop offset="100%" stop-color="#7a5a0e" />
            </radialGradient>

            <!-- Brilho central -->
            <radialGradient id="gold-glow" cx="50%" cy="50%" r="50%">
              <stop offset="0%"   stop-color="#fff5d6" stop-opacity="0.6" />
              <stop offset="100%" stop-color="#fff5d6" stop-opacity="0" />
            </radialGradient>

            <!-- Marcador de seta para a anotação "início" -->
            <marker
              id="arrow-marker"
              viewBox="0 0 10 10"
              refX="8" refY="5"
              markerWidth="6" markerHeight="6"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a3e2c" />
            </marker>

            <!-- Sombra suave -->
            <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.15)" />
            </filter>

            <!-- Filtro de brilho para hover -->
            <filter id="cell-glow">
              <feGaussianBlur stdDeviation="2" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- ─── BACKGROUND ─── -->
          <!-- Anel externo guia -->
          <circle cx="500" cy="500" r="490" class="outer-ring" />

          <!-- ─── LAYERS (preenchidos via JS) ─── -->

          <!-- Camada 1: Anel de datas (mais externo) -->
          <g id="layer-dates" aria-label="Datas do calendário"></g>

          <!-- Camada 2: Anel de tempos litúrgicos (médio) -->
          <g id="layer-seasons" aria-label="Tempos litúrgicos"></g>

          <!-- Camada 3: Anel de semanas (interno, clicável) -->
          <g id="layer-weeks" aria-label="Semanas litúrgicas"></g>

          <!-- Camada 4: Linhas divisórias (spokes) -->
          <g id="layer-spokes"></g>

          <!-- Camada 5: Textos das datas -->
          <g id="layer-date-labels"></g>

          <!-- Camada 6: Textos dos tempos litúrgicos -->
          <g id="layer-season-labels"></g>

          <!-- Camada 7: Textos das semanas -->
          <g id="layer-week-labels"></g>

          <!-- Camada 8: Anel guia interno (linha tracejada "início do ano") -->
          <g id="layer-guide"></g>

          <!-- Camada 9: Anotação "início do ano litúrgico" -->
          <g id="layer-annotation"></g>

          <!-- Camada 10: Indicador "HOJE" -->
          <g id="layer-today"></g>

          <!-- ─── CENTRO — CORDEIRO PASCAL ─── -->
          <g id="center-emblem" transform="translate(500, 500)">

            <!-- Brilho ambiental -->
            <circle cx="0" cy="0" r="180" fill="url(#gold-glow)" opacity="0.5" />

            <!-- Cruz dourada de fundo (atrás do círculo) -->
            <g id="center-cross">
              <!-- Braço vertical -->
              <path
                d="M -32 -140
                   L 32 -140
                   L 32 -50
                   L 32 50
                   L 32 140
                   L -32 140
                   L -32 50
                   L -32 -50
                   Z"
                class="center-cross-bg"
              />
              <!-- Braço horizontal -->
              <path
                d="M -140 -32
                   L 140 -32
                   L 140 32
                   L -140 32
                   Z"
                class="center-cross-bg"
              />

              <!-- Decoração nas extremidades da cruz (recortes ornamentais) -->
              <g class="center-cross-decoration" opacity="0.7">
                <!-- Topo -->
                <path d="M -32 -140 L -22 -150 L -22 -140 M 32 -140 L 22 -150 L 22 -140" />
                <!-- Base -->
                <path d="M -32 140 L -22 150 L -22 140 M 32 140 L 22 150 L 22 140" />
                <!-- Esquerda -->
                <path d="M -140 -32 L -150 -22 L -140 -22 M -140 32 L -150 22 L -140 22" />
                <!-- Direita -->
                <path d="M 140 -32 L 150 -22 L 140 -22 M 140 32 L 150 22 L 140 22" />
              </g>
            </g>

            <!-- Círculo central sobre a cruz -->
            <circle cx="0" cy="0" r="105" class="center-circle" />
            <circle cx="0" cy="0" r="98"  class="center-circle-inner" />
            <circle cx="0" cy="0" r="92"  class="center-circle-inner" />

            <!-- Letras Alfa e Ômega -->
            <text x="-72" y="0" class="center-letter">Α</text>
            <text x="72"  y="0" class="center-letter">Ω</text>

            <!-- Cordeiro Pascal (Agnus Dei) -->
            <g id="center-lamb" transform="translate(0, 5)">
              <!-- Corpo -->
              <ellipse cx="0" cy="20" rx="38" ry="26" class="center-lamb" />
              <!-- Lã do corpo (textura) -->
              <circle cx="-18" cy="12" r="9"  class="center-lamb" />
              <circle cx="-8"  cy="5"  r="8"  class="center-lamb" />
              <circle cx="6"   cy="6"  r="9"  class="center-lamb" />
              <circle cx="20"  cy="12" r="8"  class="center-lamb" />
              <circle cx="-22" cy="25" r="8"  class="center-lamb" />
              <circle cx="22"  cy="25" r="8"  class="center-lamb" />
              <!-- Cabeça -->
              <ellipse cx="-22" cy="-8" rx="14" ry="18" class="center-lamb" />
              <!-- Orelha -->
              <ellipse cx="-30" cy="-18" rx="5" ry="8"
                transform="rotate(-30 -30 -18)"
                class="center-lamb" />
              <!-- Olho -->
              <circle cx="-20" cy="-10" r="1.8" fill="#3a2a18" />
              <!-- Focinho -->
              <ellipse cx="-28" cy="-2" rx="4" ry="3" fill="#d4b48a" />

              <!-- Patas dianteiras -->
              <rect x="-15" y="38" width="5" height="18" rx="2" class="center-lamb" />
              <rect x="-6"  y="40" width="5" height="16" rx="2" class="center-lamb" />
              <!-- Patas traseiras -->
              <rect x="8"   y="40" width="5" height="16" rx="2" class="center-lamb" />
              <rect x="17"  y="38" width="5" height="18" rx="2" class="center-lamb" />

              <!-- Cascos -->
              <rect x="-15" y="54" width="5" height="3" fill="#3a2a18" opacity="0.7" />
              <rect x="-6"  y="54" width="5" height="3" fill="#3a2a18" opacity="0.7" />
              <rect x="8"   y="54" width="5" height="3" fill="#3a2a18" opacity="0.7" />
              <rect x="17"  y="54" width="5" height="3" fill="#3a2a18" opacity="0.7" />

              <!-- Auréola -->
              <circle cx="-22" cy="-10" r="22"
                fill="none" stroke="#b8891a" stroke-width="1.2"
                stroke-dasharray="3,2" opacity="0.85" />

              <!-- Estandarte (haste) -->
              <line x1="2" y1="10" x2="2" y2="-45"
                stroke="#7a5a0e" stroke-width="2" stroke-linecap="round" />
              <!-- Cruz pequena no topo da haste -->
              <line x1="-3" y1="-42" x2="7" y2="-42"
                stroke="#7a5a0e" stroke-width="2" />
              <!-- Bandeira -->
              <path d="M 2 -38 L 28 -36 L 24 -28 L 28 -20 L 2 -22 Z"
                fill="#faf5e8" stroke="#7a5a0e" stroke-width="1" />
              <!-- Cruz vermelha na bandeira -->
              <line x1="13" y1="-35" x2="13" y2="-25"
                stroke="#a01825" stroke-width="1.8" />
              <line x1="9"  y1="-29" x2="17" y2="-29"
                stroke="#a01825" stroke-width="1.8" />
            </g>
          </g>

          <!-- ─── TOOLTIP-FREE INTERACTIVE TARGETS (rendered last for z-order on top) ─── -->
          <!-- (preenchido via JS se necessário) -->

        </svg>

        <!-- Tooltip (DOM, fora do SVG) -->
        <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true">
          <div class="tooltip-title" id="tooltip-title"></div>
          <div class="tooltip-subtitle" id="tooltip-subtitle"></div>
          <div class="tooltip-bar" id="tooltip-bar"></div>
        </div>
      </div>

      <!-- ─── LEGENDA ─── -->
      <div class="legend-bar" role="list" aria-label="Legenda dos tempos litúrgicos">
        <button class="legend-item" data-season="advento" role="listitem">
          <span class="legend-dot" style="background: var(--c-advento)"></span>
          Advento
        </button>
        <button class="legend-item" data-season="natal" role="listitem">
          <span class="legend-dot bordered" style="background: var(--c-natal)"></span>
          Natal
        </button>
        <button class="legend-item" data-season="comum" role="listitem">
          <span class="legend-dot" style="background: var(--c-comum)"></span>
          Tempo Comum
        </button>
        <button class="legend-item" data-season="quaresma" role="listitem">
          <span class="legend-dot" style="background: var(--c-quaresma)"></span>
          Quaresma
        </button>
        <button class="legend-item" data-season="triduo" role="listitem">
          <span class="legend-dot" style="background: var(--c-triduo)"></span>
          Tríduo Pascal
        </button>
        <button class="legend-item" data-season="pascoa" role="listitem">
          <span class="legend-dot bordered" style="background: var(--c-pascoa)"></span>
          Páscoa
        </button>
        <button class="legend-item" data-season="rosa" role="listitem">
          <span class="legend-dot" style="background: var(--c-gaudete)"></span>
          Gaudete / Laetare
        </button>
      </div>

    </section>

    <!-- ─── PAINEL DE DETALHES (vazio por enquanto) ─── -->
    <section class="detail-panel" id="detail-panel" aria-live="polite" aria-atomic="true">
      <div class="detail-inner" id="detail-inner">
        <div class="detail-placeholder">
          <div class="placeholder-icon">✦ ✦ ✦</div>
          <p>Clique em uma semana ou tempo litúrgico para ver detalhes</p>
        </div>
      </div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════
       FOOTER
       ═══════════════════════════════════════════════ -->
  <footer class="site-footer">
    <div class="footer-ornament">— ✟ —</div>
    <p class="footer-text"><em>Ora et Labora</em> · Calendário do Rito Romano</p>
    <p class="footer-small">Conforme o Missal Romano reformado pelo Concílio Vaticano II</p>
  </footer>

  <!-- ═══════════════════════════════════════════════
       SCRIPTS
       ═══════════════════════════════════════════════ -->
  <script src="calendario.js"></script>
</body>
</html>
