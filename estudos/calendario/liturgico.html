<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendário Litúrgico · Annus Gratiæ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="calendario.css" />
</head>
<body>

  <header class="site-header">
    <p class="header-subtitle">Sancta Mater Ecclesia</p>
    <h1 class="header-title">Calendário Litúrgico</h1>
    <p class="header-tagline"><em>Annus Gratiæ</em> · O Ano da Graça</p>
  </header>

  <main class="main-container">

    <section class="wheel-section">

      <div class="wheel-wrapper">
        <!-- SVG vazio — TUDO é gerado pelo JS -->
        <svg
          id="liturgical-wheel"
          viewBox="0 0 1000 1000"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-label="Roda do Calendário Litúrgico"
        ></svg>

        <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true">
          <div class="tooltip-title"></div>
          <div class="tooltip-subtitle"></div>
          <div class="tooltip-bar"></div>
        </div>
      </div>

      <!-- Legenda -->
      <div class="legend-bar" role="group" aria-label="Legenda das cores litúrgicas">
        <button class="legend-item" data-key="advento" type="button">
          <span class="legend-dot" style="background:#b9a8d4"></span>Advento
        </button>
        <button class="legend-item" data-key="natal" type="button">
          <span class="legend-dot bordered" style="background:#fdfaf2"></span>Natal
        </button>
        <button class="legend-item" data-key="comum" type="button">
          <span class="legend-dot" style="background:#4ea045"></span>Tempo Comum
        </button>
        <button class="legend-item" data-key="quaresma" type="button">
          <span class="legend-dot" style="background:#a690c2"></span>Quaresma
        </button>
        <button class="legend-item" data-key="triduo" type="button">
          <span class="legend-dot" style="background:#a31827"></span>Tríduo Pascal
        </button>
        <button class="legend-item" data-key="pascoa" type="button">
          <span class="legend-dot bordered" style="background:#fdfaf2"></span>Páscoa
        </button>
        <button class="legend-item" data-key="pentecostes" type="button">
          <span class="legend-dot" style="background:#cc1f2e"></span>Pentecostes
        </button>
        <button class="legend-item" data-key="rosa" type="button">
          <span class="legend-dot" style="background:#e8b8c8"></span>Gaudete / Laetare
        </button>
      </div>

    </section>

    <!-- Painel de detalhes -->
    <section class="detail-panel" id="detail-panel" aria-live="polite">
      <div id="detail-inner">
        <div class="detail-placeholder">
          <div class="placeholder-icon">✦ ✦ ✦</div>
          <p>Clique em uma semana ou tempo litúrgico para ver detalhes</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-ornament">— ✟ —</div>
    <p class="footer-text"><em>Ora et Labora</em> · Calendário do Rito Romano</p>
    <p class="footer-small">Conforme o Missal Romano reformado pelo Concílio Vaticano II</p>
  </footer>

  <script src="calendario.js"></script>
</body>
</html>
